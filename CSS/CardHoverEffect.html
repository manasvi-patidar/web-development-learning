<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Hover Effect</title>
    <link rel="stylesheet" href="CardHoverEffect.css" />
</head>
<body>
    <div class="card">
        <img src="manimage.jpg" alt="man" />
        <div class="desc">
            <h3>Richard Williams</h3>
            <p>Data Analyst</p>
        </div>
    </div>
    <div class="card">
        <img src="womanimage.jpg" alt="woman" />
        <div class="desc">
            <h3>Olivia Brown</h3>
            <p>Software Engineer</p>
        </div>
    </div>
</body>
</html>
