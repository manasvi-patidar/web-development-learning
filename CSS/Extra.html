<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Basics</title>
    <style>
      h1 {
        color: white;
        background-color: lightsalmon;
      }
    </style>
  </head>
  <body>
    <!--Inline Style-->
    <h1 style="color: lightyellow">Manasvi Patidar</h1>
    <p style="color: pink">This is a paragraph.</p>
    <button style="color: blue; background-color: lightgreen">Help</button>

    <!--Style Tag-->
    <h1>with love</h1>
    <h1>with love</h1>
    <h1>with love</h1>
  </body>
</html>
