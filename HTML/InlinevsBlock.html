<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline VS Block Elements</title>
</head>
<body>

    <!--new statement starts from a new line so heading is a block element-->
    <h1>Manasvi Patidar</h1>
    <h1>Software Engineer</h1>

    <!--paragraph tag is also a block element-->
    <p>I love to code.</p>
    <p>I love to dance.</p>

    <!--appears on the same line on web page so anchor tag is an inline element-->
    <a href="www.google.com">Google</a>
    <a href="www.facebook.com">Facebook</a>
    <a href="www.netflix.com">Netflix</a>

    <!--Both images displayed on the same line in web page so image is an inline element-->
    <img src="https://extension.psu.edu/media/catalog/product/5/9/598fa4dc3131dff06c11acffafcc0e6a.jpeg?quality=80&bg-color=255,255,255&fit=bounds&height=&width=&canvas=:" height="500px" width="400px">
    <img src="https://images.jdmagicbox.com/quickquotes/images_main/fresh-black-grape-fruit-2227145263-qst1wfbb.jpg">
</body>
</html>
