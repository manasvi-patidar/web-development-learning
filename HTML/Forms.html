<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms in HTML</title>
</head>
<body>
    <form action="/action">
        <label>
        Username
         <input type="text" placeholder="enter username" />
        </label>
        <br>
        <label>
         Password
         <input type="password" placeholder="enter password" />
        </label>
        <br>
        <label>
         Number
         <input type="number" />
        </label>
        <br>
        <label>
         Time
         <input type="time" />
        </label>
        <br>
        <label>
         Color
         <input type="Color" />
        </label>
        <br>
    </form>
</body>
</html>
