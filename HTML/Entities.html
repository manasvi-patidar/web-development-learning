<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Entities</title>
</head>
<body>
    <!--Print less than symbol-->
    <h1>a&lt;b</h1>

    <!--HTML don't allow multiple spaces in between but here the magic is:)-->
    <p>Apna &nbsp;  College</p>

    <!--Print heart symbol-->
    <h1>&hearts;</h1>
    <h1>&#9829;</h1>

    <!--Some Commmon Entities-->
    <p>a &gt; b</p>
    <p>a &amp; b</p>
    <p>a &quot;b&quot;</p>
    <h1>This is a &bigstar; </h1>
    <h1>This is an &bkarow; </h1>
</body>
</html>
