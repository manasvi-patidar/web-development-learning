<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscript & Superscript Tag</title>
</head>
<body>
    <!--here sup & sub tags are nested tags.h3 is parent element -->
    <h3>a<sup>2</sup></h3>
    <h3>H<sub>2</sub>O</h3>
</body>
</html>
